services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_DRIVER=sqlite
      - DATABASE_URL=file:/data/yourstruly.db
      - LYRICA_BASE_URL=https://lyrica.collei.my.id
      - TURNSTILE_ENABLED=false
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:4000
